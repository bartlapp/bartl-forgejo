version: "17.0.1"
controller:
  image: ghcr.io/bartlapp/bartl-forgejo-controller@sha256:69d837bc30b806097110bef4fe17d94b87ecd0596fca4a3e2a847a23cba7c8f0
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
claims:
  state: forgejo-state
  staging: forgejo-capture
configurationSecret: forgejo-configuration
bootstrapSecret: ""
oidc:
  name: keycloak
tls:
  managed: true
  acmeServer: https://acme-v02.api.letsencrypt.org/directory
ingress:
  enabled: true
  className: traefik
  tlsSecret: forgejo-tls
ssh:
  port: 2222
  exposure: LoadBalancer
backup:
  readerSecret: forgejo-backup-reader
  writerSecret: forgejo-backup-writer
  schedule: ""
  timeZone: UTC
