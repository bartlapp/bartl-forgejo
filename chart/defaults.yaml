version: "17.0.1"
controller:
  image: ghcr.io/bartlapp/bartl-forgejo-controller@sha256:af74372c9ffb5ac8fcde82313edc215ec39caad73dd5b5e96d257982a6db9669
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
claims:
  state: forgejo-state
  staging: forgejo-capture
configurationSecret: forgejo-configuration
bootstrapSecret: ""
oidc:
  name: keycloak
tls:
  managed: true
  acmeServer: https://acme-v02.api.letsencrypt.org/directory
ingress:
  enabled: true
  className: traefik
  tlsSecret: forgejo-tls
ssh:
  port: 2222
  exposure: LoadBalancer
backup:
  readerSecret: forgejo-backup-reader
  writerSecret: forgejo-backup-writer
  schedule: ""
  timeZone: UTC
