{{- if eq .Values.renderMode "deployment" }}
{{- $selection := include "forgejo.selection" . | fromYaml }}
{{- $service := include "forgejo.service" . | fromYaml }}
{{- $oidc := include "forgejo.oidc" (dict "root" . "service" $service) | fromYaml }}
{{- $backup := include "forgejo.backup" (dict "root" . "service" $service) | fromYaml }}
apiVersion: forgejo.bartl.sh/v1alpha1
kind: ForgejoApplication
metadata:
  name: forgejo
  namespace: {{ .Release.Namespace }}
spec:
  identity:
    installation: {{ .Values.installation | quote }}
    instance: {{ $selection.instance | quote }}
  version: {{ $service.version | quote }}
  replicas: {{ $service.replicas }}
  claim: {{ $service.claims.state | quote }}
  stagingClaim: {{ $service.claims.staging | quote }}
  configurationSecret: {{ $service.configurationSecret | quote }}
  {{- with $service.bootstrapSecret }}
  bootstrapSecret: {{ . | quote }}
  {{- end }}
  {{- if $backup.enabled }}
  backup:
    {{- $native := omit $backup "enabled" "endpoint" }}
    {{- if not $native.schedule }}{{- $_ := unset $native "schedule" }}{{- end }}
    {{- toYaml $native | nindent 4 }}
  {{- end }}
  ingress:
    enabled: {{ $service.ingress.enabled }}
    host: {{ $service.hostname | quote }}
    className: {{ $service.ingress.className | quote }}
    tlsSecret: {{ $service.ingress.tlsSecret | quote }}
  ssh:
    port: {{ $service.ssh.port }}
{{- end }}
