{{- if eq .Values.renderMode "deployment" }}
{{- $service := include "forgejo.service" . | fromYaml }}
{{- if $service.tls.managed }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: forgejo-letsencrypt
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/part-of: bartl-forgejo
spec:
  acme:
    server: {{ $service.tls.acmeServer | quote }}
    privateKeySecretRef:
      name: forgejo-letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ $service.ingress.className | quote }}
            serviceType: ClusterIP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $service.ingress.tlsSecret | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/part-of: bartl-forgejo
spec:
  secretName: {{ $service.ingress.tlsSecret | quote }}
  dnsNames:
    - {{ $service.hostname | quote }}
  issuerRef:
    name: forgejo-letsencrypt
    kind: Issuer
{{- end }}
{{- end }}
