{{- if eq .Values.renderMode "deployment" }}
{{- $service := include "forgejo.service" . | fromYaml }}
apiVersion: v1
kind: Service
metadata:
  name: forgejo-ssh
  namespace: {{ .Release.Namespace | quote }}
spec:
  type: {{ $service.ssh.exposure }}
  selector:
    app.kubernetes.io/name: forgejo
    forgejo.bartl.sh/role: app
  ports:
    - name: ssh
      port: {{ $service.ssh.port }}
      targetPort: 2222
      protocol: TCP
      {{- with $service.ssh.nodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
