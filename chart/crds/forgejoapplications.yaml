apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: forgejoapplications.forgejo.bartl.sh
spec:
  group: forgejo.bartl.sh
  scope: Namespaced
  names:
    plural: forgejoapplications
    singular: forgejoapplication
    kind: ForgejoApplication
    shortNames: [forgejoapp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Intent
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [identity, version, replicas, claim, stagingClaim, configurationSecret, ingress, ssh]
              x-kubernetes-validations:
                - rule: self.claim != self.stagingClaim
                  message: State and capture claims must be distinct
                - rule: self.identity == oldSelf.identity
                  message: Application identity is immutable
              properties:
                identity:
                  type: object
                  required: [installation, instance]
                  properties:
                    installation: {type: string, minLength: 1, maxLength: 128}
                    instance: {type: string, minLength: 1, maxLength: 128}
                version:
                  type: string
                  enum: ["16.0.7", "17.0.1"]
                replicas:
                  type: integer
                  enum: [0, 1]
                claim: {type: string, minLength: 1}
                stagingClaim: {type: string, minLength: 1}
                configurationSecret: {type: string, minLength: 1}
                bootstrapSecret: {type: string, minLength: 1}
                backup:
                  type: object
                  required: [repository, readerSecret, writerSecret]
                  properties:
                    repository: {type: string, minLength: 1}
                    readerSecret: {type: string, minLength: 1}
                    writerSecret: {type: string, minLength: 1}
                    schedule: {type: string, minLength: 1}
                    timeZone: {type: string, default: UTC}
                ingress:
                  type: object
                  required: [enabled]
                  properties:
                    enabled: {type: boolean}
                    host: {type: string}
                    className: {type: string}
                    tlsSecret: {type: string}
                ssh:
                  type: object
                  properties:
                    port: {type: integer, minimum: 1, maximum: 65535, default: 2222}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                preparedVersion: {type: string}
                preparedClaim: {type: string}
                lastHandledBackupRequest: {type: string}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", Unknown]}
                      observedGeneration: {type: integer, format: int64}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                operation:
                  type: object
                  required: [id, kind, phase, version, claim, generation]
                  properties:
                    id: {type: string}
                    kind: {type: string}
                    phase:
                      type: string
                      enum: [Draining, Preparing, Capturing, Publishing, Succeeded, Failed]
                    version: {type: string}
                    claim: {type: string}
                    stagingClaim: {type: string}
                    generation: {type: integer, format: int64}
                    request: {type: string}
                    message: {type: string}
                    jobCreated: {type: boolean}
                    jobUID: {type: string}
                backup:
                  type: object
                  properties:
                    request: {type: string}
                    operation: {type: string}
                    snapshot: {type: string}
                    message: {type: string}
                    success: {type: boolean}
                    completedAt: {type: string, format: date-time}
